<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SkillUp Academy | AI Quiz</title>

<style>

:root{
  --primary:#1769e0;
  --secondary:#315be8;
  --bg:#f5f8fc;
  --card:#ffffff;
  --text:#172033;
  --muted:#667280;
  --border:#e1e7ef;
  --success:#16803c;
  --danger:#dc2626;
  --warning:#d97706;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
}

header{
  height:68px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:23px;
  font-weight:800;
  color:var(--primary);
}

nav a{
  text-decoration:none;
  color:var(--text);
  margin-left:25px;
  font-weight:600;
}

nav a:hover{
  color:var(--primary);
}

.container{
  max-width:1000px;
  margin:40px auto;
  padding:0 20px;
}

.hero{
  background:linear-gradient(135deg,#123b70,#1769e0);
  color:white;
  padding:45px;
  border-radius:24px;
  margin-bottom:30px;
}

.hero h1{
  font-size:40px;
  margin-bottom:12px;
}

.hero p{
  font-size:17px;
  opacity:.9;
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:30px;
  box-shadow:0 8px 25px rgba(20,40,80,.06);
}

h2{
  margin-bottom:25px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.field label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
}

select{
  width:100%;
  padding:13px;
  border:1px solid #ccd5e0;
  border-radius:10px;
  font-size:15px;
  background:white;
}

button{
  border:none;
  border-radius:10px;
  padding:13px 22px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.primary{
  background:var(--primary);
  color:white;
}

.primary:hover{
  background:#0d55bf;
}

.chatgpt{
  background:#111827;
  color:white;
}

.chatgpt:hover{
  background:#000000;
}

.secondary{
  background:#eef4ff;
  color:var(--primary);
}

.buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
  flex-wrap:wrap;
}

.notice{
  margin-top:20px;
  padding:15px;
  background:#fff8df;
  border-radius:10px;
  color:#705800;
  font-size:14px;
}

#quizArea{
  margin-top:30px;
}

.quiz-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.score-box{
  background:#eef4ff;
  color:var(--primary);
  padding:10px 18px;
  border-radius:10px;
  font-weight:800;
}

.question{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
}

.question h3{
  margin-bottom:15px;
}

.question-text{
  font-size:17px;
  font-weight:600;
  margin-bottom:15px;
}

.option{
  display:block;
  padding:13px;
  border:1px solid var(--border);
  border-radius:9px;
  margin:8px 0;
  cursor:pointer;
  transition:.2s;
}

.option:hover{
  background:#f1f6ff;
  border-color:#b9cff5;
}

.option input{
  margin-right:10px;
}

.feedback{
  margin-top:14px;
  padding:12px;
  border-radius:9px;
  display:none;
  font-size:14px;
}

.feedback.correct{
  display:block;
  background:#e9f8ef;
  color:var(--success);
  border:1px solid #b7e4c7;
}

.feedback.incorrect{
  display:block;
  background:#fff0f0;
  color:var(--danger);
  border:1px solid #f2b8b8;
}

.result{
  background:#e9f8ef;
  border:1px solid #b7e4c7;
  padding:25px;
  border-radius:15px;
  margin-top:25px;
  text-align:center;
}

.result h2{
  margin-bottom:10px;
  color:var(--success);
}

.result-score{
  font-size:32px;
  font-weight:800;
  margin:10px 0;
}

.empty{
  text-align:center;
  padding:35px;
}

.small{
  color:var(--muted);
  font-size:14px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .hero{
    padding:30px 25px;
  }

  .hero h1{
    font-size:30px;
  }

  nav{
    display:none;
  }

  .card{
    padding:20px;
  }

  .buttons{
    flex-direction:column;
  }

  button{
    width:100%;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    🅂 SkillUp Academy
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="quiz.html">Quiz</a>
  </nav>

</header>


<div class="container">

  <section class="hero">

    <h1>🧠 AI Quiz Generator</h1>

    <p>
      Create focused NEET/JEE practice quizzes by
      subject, chapter and difficulty.
    </p>

  </section>


  <section class="card">

    <h2>Configure Your Quiz</h2>

    <div class="grid">

      <div class="field">

        <label for="exam">Exam</label>

        <select id="exam">

          <option>NEET</option>
          <option>JEE Main</option>
          <option>JEE Advanced</option>

        </select>

      </div>


      <div class="field">

        <label for="subject">Subject</label>

        <select id="subject" onchange="updateTopics()">

          <option value="Physics">Physics</option>
          <option value="Chemistry">Chemistry</option>
          <option value="Botany">Botany</option>
          <option value="Zoology">Zoology</option>
          <option value="Mathematics">Mathematics</option>

        </select>

      </div>


      <div class="field">

        <label for="topic">Chapter / Topic</label>

        <select id="topic"></select>

      </div>


      <div class="field">

        <label for="difficulty">Difficulty</label>

        <select id="difficulty">

          <option>Easy</option>
          <option selected>Medium</option>
          <option>Hard</option>

        </select>

      </div>


      <div class="field">

        <label for="questions">Number of Questions</label>

        <select id="questions">

          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="20">20</option>
          <option value="30">30</option>

        </select>

      </div>

    </div>


    <div class="buttons">

      <button
        class="primary"
        onclick="generateQuiz()">

        🚀 Generate Quiz

      </button>


      <button
        class="chatgpt"
        onclick="createWithChatGPT()">

        ✨ Create with ChatGPT

      </button>

    </div>


    <div class="notice">

      ⚠️ The ChatGPT button opens ChatGPT with a prepared
      quiz-generation prompt. No OpenAI secret API key is
      stored in this GitHub Pages website.

    </div>

  </section>


  <div id="quizArea"></div>

</div>


<script>
/* =========================================================
   SKILLUP ACADEMY — GEMINI AI QUIZ
   Firebase Function: generateQuiz
========================================================= */

const FIREBASE_FUNCTION_URL =
  "https://us-central1-skill-up-j6olyb.cloudfunctions.net/generateQuiz";

let currentQuestions = [];
let userScore = 0;

function updateTopics() {
  const subject = document.getElementById("subject").value;
  const topic = document.getElementById("topic");

  const topics = {
    Physics: [
      "Units & Measurements",
      "Motion in One Dimension",
      "Laws of Motion",
      "Work, Energy & Power"
    ],

    Chemistry: [
      "Organic Chemistry — GOC",
      "Some Basic Concepts of Chemistry",
      "Atomic Structure",
      "Chemical Bonding",
      "Thermodynamics",
      "Equilibrium"
    ],

    Botany: [
      "Cell Biology",
      "Plant Physiology",
      "Plant Kingdom",
      "Morphology of Flowering Plants"
    ],

    Zoology: [
      "Human Physiology",
      "Animal Kingdom",
      "Human Reproduction",
      "Genetics & Evolution"
    ],

    Mathematics: [
      "Sets & Relations",
      "Quadratic Equations",
      "Sequence & Series",
      "Differential Calculus"
    ]
  };

  topic.innerHTML = "";

  (topics[subject] || []).forEach(function(item) {
    const option = document.createElement("option");
    option.value = item;
    option.textContent = item;
    topic.appendChild(option);
  });
}

async function generateQuiz() {
  const exam = document.getElementById("exam").value;
  const subject = document.getElementById("subject").value;
  const topic = document.getElementById("topic").value;
  const difficulty = document.getElementById("difficulty").value;
  const count = Number(document.getElementById("questions").value);
  const quizArea = document.getElementById("quizArea");

  if (!exam || !subject || !topic || !difficulty || !count) {
    quizArea.innerHTML = `
      <section class="card empty">
        <h2>⚠️ Please select all quiz options</h2>
      </section>
    `;
    return;
  }

  quizArea.innerHTML = `
    <section class="card empty">
      <h2>🧠 Generating your quiz...</h2>
      <p class="small">
        Gemini is creating exactly ${count} questions for
        ${subject} — ${topic}.
      </p>
    </section>
  `;

  try {
    const response = await fetch(FIREBASE_FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        exam: exam,
        subject: subject,
        topic: topic,
        difficulty: difficulty,
        count: count
      })
    });

    const data = await response.json().catch(function() {
      return {};
    });

    if (!response.ok || !data.success) {
      throw new Error(
        data.error || "The AI quiz service returned an error."
      );
    }

    if (!Array.isArray(data.questions)) {
      throw new Error("Invalid quiz data received from Firebase.");
    }

    if (data.questions.length !== count) {
      throw new Error(
        "Requested " +
        count +
        " questions, but received " +
        data.questions.length +
        ". Please try again."
      );
    }

    currentQuestions = data.questions.map(function(q) {
      return {
        question: String(q.question || ""),
        options: Array.isArray(q.options) ? q.options : [],
        answer: Number(q.answer),
        explanation: String(q.explanation || "")
      };
    });

    userScore = 0;

    renderQuiz(exam, subject, topic, difficulty);

  } catch (error) {
    console.error("Generate Quiz error:", error);

    quizArea.innerHTML = `
      <section class="card empty">
        <h2>❌ Unable to generate the quiz</h2>
        <p class="small">${escapeHtml(error.message)}</p>
        <br>
        <button class="primary" onclick="generateQuiz()">
          🔄 Try Again
        </button>
      </section>
    `;
  }
}

function renderQuiz(exam, subject, topic, difficulty) {
  const quizArea = document.getElementById("quizArea");

  let html = `
    <section class="card">

      <div class="quiz-header">

        <div>
          <h2>${escapeHtml(exam)} — ${escapeHtml(subject)}</h2>

          <p class="small">
            Topic:
            <strong>${escapeHtml(topic)}</strong>
            |
            Difficulty:
            <strong>${escapeHtml(difficulty)}</strong>
            |
            Questions:
            <strong>${currentQuestions.length}</strong>
          </p>
        </div>

        <div class="score-box">
          Score:
          <span id="liveScore">0</span>
        </div>

      </div>
  `;

  currentQuestions.forEach(function(q, index) {

    html += `
      <div class="question">

        <h3>
          Question ${index + 1}
        </h3>

        <p class="question-text">
          ${escapeHtml(q.question)}
        </p>
    `;

    q.options.forEach(function(option, optionIndex) {

      html += `
        <label class="option">

          <input
            type="radio"
            name="question${index}"
            value="${optionIndex}"
          >

          ${String.fromCharCode(65 + optionIndex)}.
          ${escapeHtml(option)}

        </label>
      `;
    });

    html += `
        <button
          class="primary"
          onclick="checkAnswer(${index})"
        >
          Check Answer
        </button>

        <div
          id="feedback${index}"
          class="feedback"
        ></div>

      </div>
    `;
  });

  html += `
      <div id="finalResult"></div>

    </section>
  `;

  quizArea.innerHTML = html;

  window.scrollTo({
    top: quizArea.offsetTop - 20,
    behavior: "smooth"
  });
}

function checkAnswer(index) {
  const question = currentQuestions[index];

  const selected = document.querySelector(
    `input[name="question${index}"]:checked`
  );

  const feedback = document.getElementById(
    `feedback${index}`
  );

  if (!selected) {
    feedback.className = "feedback incorrect";
    feedback.innerHTML = "⚠️ Please select an answer.";
    return;
  }

  if (feedback.dataset.checked === "true") {
    return;
  }

  feedback.dataset.checked = "true";

  const selectedAnswer = Number(selected.value);

  if (selectedAnswer === question.answer) {
    userScore++;

    feedback.className = "feedback correct";

    feedback.innerHTML = `
      ✅ <strong>Correct!</strong>
      <br>
      <span>${escapeHtml(question.explanation)}</span>
    `;
  } else {
    const answerLetter =
      String.fromCharCode(65 + question.answer);

    feedback.className = "feedback incorrect";

    feedback.innerHTML = `
      ❌ <strong>Incorrect.</strong>
      <br>
      Correct answer:
      <strong>
        ${answerLetter}.
        ${escapeHtml(question.options[question.answer])}
      </strong>
      <br>
      <span>${escapeHtml(question.explanation)}</span>
    `;
  }

  const liveScore = document.getElementById("liveScore");

  if (liveScore) {
    liveScore.textContent = userScore;
  }

  updateFinalResult();
}

function updateFinalResult() {
  if (!currentQuestions.length) {
    return;
  }

  const answered = currentQuestions.filter(function(q, index) {
    const feedback = document.getElementById(
      `feedback${index}`
    );

    return (
      feedback &&
      feedback.dataset.checked === "true"
    );
  }).length;

  if (answered !== currentQuestions.length) {
    return;
  }

  const total = currentQuestions.length;

  const percentage = Math.round(
    (userScore / total) * 100
  );

  let message;

  if (percentage >= 80) {
    message = "Excellent performance! 🎉";
  } else if (percentage >= 60) {
    message = "Good work! Keep practicing. 👍";
  } else {
    message = "Keep learning and try again. 💪";
  }

  document.getElementById("finalResult").innerHTML = `
    <div class="result">

      <h2>🎯 Quiz Completed</h2>

      <div class="result-score">
        ${userScore} / ${total}
      </div>

      <p>
        ${percentage}% — ${message}
      </p>

      <br>

      <button
        class="secondary"
        onclick="generateQuiz()"
      >
        🔄 Generate Another Quiz
      </button>

    </div>
  `;
}

function createWithChatGPT() {
  const exam = document.getElementById("exam").value;
  const subject = document.getElementById("subject").value;
  const topic = document.getElementById("topic").value;
  const difficulty = document.getElementById("difficulty").value;
  const count = document.getElementById("questions").value;

  const prompt = `
Create a ${count}-question ${exam} level MCQ quiz
for SkillUp Academy.

Subject: ${subject}

Chapter/Topic: ${topic}

Difficulty: ${difficulty}

Requirements:

1. Create exactly ${count} MCQs.
2. Give four options A, B, C and D.
3. Give the correct answer.
4. Give a short explanation.
5. Follow NCERT-based concepts where applicable.
6. Make the questions suitable for ${exam}.
7. Do not repeat questions.
8. Include conceptual and exam-oriented questions.
9. Format clearly for students.
10. Verify the scientific accuracy of every answer.

Format:

Q1. Question

A. Option
B. Option
C. Option
D. Option

Answer: X

Explanation: Short explanation.

Continue until all ${count} questions are completed.
`;

  const url =
    "https://chatgpt.com/?q=" +
    encodeURIComponent(prompt);

  window.open(url, "_blank");
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

updateTopics();
</script>

</body>
</html>
